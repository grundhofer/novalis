[package]
name = "novalis-core"
description = "UI-free core of novalis: vault filesystem, atomic saves, cache, search, links, boards, migration"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# chrono without `clock`: local time comes from libc `localtime_r` so no
# iana-time-zone / core-foundation-sys enters the tree (D26).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
libc = "0.2.189"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
trash = "5.2.7"
# ULID without `std`: the random half comes from /dev/urandom via std, so no
# `rand` stack is pulled in.
ulid = { version = "3.0.0", default-features = false }
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3.27.0"
