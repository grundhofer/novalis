[package]
name = "novalis-core"
description = "UI-agnostic core logic for Novalis (vault, index, notes, tasks, calendar)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
specta.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
gray_matter = "0.3"
serde_yaml = "0.9"
walkdir = "2"
regex = "1"
log = "0.4"
sha2 = "0.10"
pulldown-cmark = "0.13"
docx-rs = "0.4"
icalendar = "0.17"
rrule = "0.14"
similar = "3"
# Third-party importers (`import::`). `zip` unpacks a Notion "Export" archive;
# `quick-xml` parses the Evernote ENEX envelope AND its ENML/XHTML note bodies
# (one XML parser for both, so no html5ever/scraper enters the core tree — the
# ENML→Markdown converter is in-house in `import::enex`).
#
# zip is on 8.x and there is now exactly ONE zip in `Cargo.lock`: `docx-rs`
# 0.4.22 depends on `zip = "8.6.0"` itself, so moving off 0.6 here removed the
# last holder of the old line rather than adding a second one.
#
# The feature choice is not arbitrary. zip 8 has no miniz_oxide backend, so the
# only pure-Rust option is `deflate-flate2-zlib-rs`; every other
# `deflate-flate2-*` feature links a C zlib. That sounds like it would swap the
# deflate implementation workspace-wide — `flate2` compiles exactly ONE backend
# by cfg priority and `any_zlib` wins — but it does NOT, because docx-rs's zip 8
# already enables that same backend. `cargo tree -e features -i flate2` is
# identical before and after this dependency moved. Verify with that command
# before believing any claim about it either way.
#
# Kept minimal rather than plain `features = ["deflate"]` (which also drags in
# `zopfli`) so this line still says what we actually need if docx-rs ever drops
# zip: the importer only reads, and the one writer here uses `Stored`.
#
# quick-xml is on 0.41, which clears RUSTSEC-2026-0194 and -0195 outright —
# both are now gone from `.cargo/audit.toml`'s ignore list rather than justified
# in it. This was blocked while docx-rs pinned 0.36.2; docx-rs 0.4.22 moved to
# 0.41, novalis-core was the last holder of the old line, and 0.36 has left
# `Cargo.lock`. This is the one parser that sees UNTRUSTED input (a
# user-supplied `.enex`), so that matters more here than anywhere else.
#
# `escape-html` is load-bearing, not cosmetic. ENML is XHTML, so note bodies
# routinely carry `&nbsp;` and `&mdash;`, which are NOT among XML's five
# predefined entities. Without this feature they do not resolve — and on 0.36
# that was worse than it sounds: `unescape()` returned Err for the whole text
# node and the call site's `.unwrap_or_default()` turned it into an empty
# string, silently deleting the entire run. See the regression tests in
# `import::enex`.
#
# The migration itself is the reason a bump was never a one-liner: 0.41 emits
# entity references as separate `Event::GeneralRef` events instead of resolving
# them inline. `BytesText::unescape()` no longer exists, so the code does not
# compile until you touch it — but the trap is the SECOND half, where an
# unhandled `GeneralRef` arm silently drops every `&amp;` from an imported note
# while everything still builds and the old tests still pass.
zip = { version = "8.6", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }
quick-xml = { version = "0.41", features = ["escape-html"] }
uuid = { workspace = true }
git2 = { workspace = true }
# P2P sync (W4.4): pure crypto/framing/pairing logic. `chacha20poly1305`
# (XChaCha20-Poly1305 AEAD) seals file contents E2E; `postcard` frames the
# wire protocol; `base64` encodes the pairing ticket. All pure-Rust — no
# openssl — so they add nothing to the openssl isolation surface. The async
# `iroh` QUIC transport lives in the desktop shell, not here.
# `features = ["zeroize"]` is NOT optional here. Up to 0.10, `ChaChaPoly1305`
# implemented `ZeroizeOnDrop` unconditionally and wiped the key on drop; in 0.11
# that — and the wipe of the derived Poly1305 one-time key — moved behind this
# feature, which is OFF by default. Every seal/open builds a cipher, so without
# it each call would leave a live 32-byte vault key in freed memory for the
# allocator to hand out again. That is the whole zero-knowledge claim of the
# sync, and no test can observe the difference.
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
rand = "0.10"
base64 = { version = "0.23", default-features = false, features = ["std"] }
postcard = { version = "1", features = ["use-std"] }
# Pure-Rust HNSW: the native ANN backing chunk-level semantic retrieval. Chosen
# over the sqlite-vec vec0 extension so the multi-model/variable-dim vectors that
# already coexist in one table stay supported, queries run off the engine
# write-lock, and no process-global C extension has to be loaded — see
# `index::vectors::VectorIndex`.
hnsw_rs = "0.3"

[dev-dependencies]
tempfile = "3"
