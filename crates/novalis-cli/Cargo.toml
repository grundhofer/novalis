[package]
name = "novalis-cli"
description = "The headless `novalis` binary: vault operations on novalis-core, JSON out, exit codes 0-8"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "novalis"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
novalis-core.workspace = true
regex = "1.13.1"
schemars = "1.2.2"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
