# cargo-deny — keeps the dependency tree's licensing and provenance from
# drifting. `cargo audit` already covers vulnerabilities; this covers the two
# things it does not: what we are allowed to ship, and where crates come from.
#
# Run locally with `cargo deny check`. CI runs it in the `dependency audit` job.

[graph]
# Check every platform we ship, not just the host — a Windows- or Linux-only
# dependency must not be able to slip a license past a macOS developer.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false

[licenses]
# The exact set of licenses declared by *third-party* Rust crate manifests in
# the tree today. Novalis's own three crates are AGPL-3.0-only and are handled
# by the per-crate exceptions below, not by this list — see the comment there.
#
# Every entry is permissive or file-level weak copyleft, so all of them are
# compatible with conveying the combined binary under AGPL-3.0-only (Apache-2.0
# and MPL-2.0 are one-way compatible with GPLv3/AGPLv3; the rest impose no
# license choice at all). That is the *only* claim this list makes. In
# particular it does not mean the obligations are discharged: several of these
# licenses require their text to be handed to the recipient, which is the job of
# THIRD-PARTY-NOTICES.md plus the `licenses/` directory bundled by
# tauri.conf.json's `bundle.resources`. A green run here proves nothing about
# that.
#
# Adding to this list is a deliberate legal decision: if a new dependency needs
# an entry, check what it actually obliges you to do and record it in
# THIRD-PARTY-NOTICES.md at the same time.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level weak copyleft, from Tauri's stack (cssparser, selectors,
    # attohttpc, option-ext, dtoa-short). Obliges disclosure only for
    # modifications to those files, and we vendor no patches.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# A crate offering `MIT OR Apache-2.0 OR LGPL-2.1-or-later` (r-efi) resolves to
# MIT by this ordering rather than tripping the copyleft check.
confidence-threshold = 0.9

# NOTE: cargo-deny reads crate manifests, so it CANNOT see the license of
# vendored C sources. `libgit2-sys` declares `MIT OR Apache-2.0` for its Rust
# binding, while the C it vendors and statically links is:
#   - libgit2 itself         GPL-2.0 WITH a linking exception
#   - libgit2/deps/xdiff/    LGPL-2.1-or-later (LibXDiff, Davide Libenzi) —
#                            NOT covered by that exception; Libenzi is not a
#                            libgit2 author and COPYING never mentions xdiff
#   - xdiff/xhistogram.c     EDL-1.0 (Google/JGit)
#   - libgit2/deps/winhttp/  LGPL-2.1-or-later, Windows builds only
# `openssl-src` (Apache-2.0) and `whisper-rs-sys` (MIT) have the same shape.
# All of it is documented by hand in THIRD-PARTY-NOTICES.md, with the license
# texts in `licenses/`. A green `cargo deny check licenses` does not discharge
# that.
#
# Do NOT "fix" the omission by adding LGPL-2.1-or-later or EDL to `allow`:
# cargo-deny raises no error for either, because no crate *manifest* declares
# them. Listing them would be a false statement about the crate graph, and it
# would silently green-light a future LGPL *crate* — which, unlike vendored C
# behind a linking exception, would be a genuinely new obligation.
#
# That vendored C is also the one place where Novalis's own AGPL-3.0-only is
# load-bearing rather than decorative: GPL-2.0-*only* is not compatible with
# AGPL-3.0, so libgit2 could not be conveyed inside this binary at all if it
# were not for its LINKING EXCEPTION, which permits linking the compiled library
# "into combinations with other programs ... without any restriction coming from
# the use of this file" (licenses/libgit2-COPYING.txt). LibXDiff's
# `-or-later` lets it be taken as LGPL-3.0, which AGPL-3.0 accommodates. Neither
# conclusion is something cargo-deny checked; both are reasoned out in
# THIRD-PARTY-NOTICES.md.

# Novalis's own crates. AGPL-3.0-only is scoped to exactly these three by name
# rather than added to `allow`, so the allow-list keeps meaning "what we accept
# from other people's code" and a third-party AGPL crate still trips the check —
# which is what we want, because an inbound copyleft dependency is a decision
# about the commercial-exception path (COMMERCIAL-LICENSE.md: code the copyright
# holder cannot relicense), not a formality.
# All three inherit the license from `[workspace.package]`; none declares its
# own. The alternative, `[licenses] private.ignore`, only skips crates marked
# `publish = false`, and setting that would change these crates' publishability
# as a side effect of a lint setting.
[[licenses.exceptions]]
name = "novalis-core"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "novalis-extension"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "novalis-desktop"
allow = ["AGPL-3.0-only"]

[bans]
multiple-versions = "warn"
# `warn`, not `deny`, and deliberately so: the only wildcards in this tree are
# our own in-workspace `novalis-core.workspace = true` path dependencies, which
# resolve via `path` — there is no registry version to pin and nothing a
# typosquatter could substitute. `allow-wildcard-paths` does not exempt them
# because cargo-deny applies it only to crates marked `publish = false`, and
# changing that would alter these crates' publishability as a side effect of a
# lint setting. Revisit if a real registry wildcard ever appears.
wildcards = "warn"
# `cargo audit` flags advisories against crates that are only in Cargo.lock and
# never compiled; this catches the inverse — a crate pulled in twice at
# different majors, which bloats the binary we ask users to download.
highlight = "all"

# ── Windows-only tripwire: keep cpal and wmi off windows-core 0.61 ────────────
#
# `cpal` and `wmi` each declare `windows` AND `windows-core` as two INDEPENDENT
# version ranges spanning the 0.61/0.62 majors. Cargo resolves the two edges
# with no coupling between them, so an unrelated dependency bump can flip one
# and not the other. When that happens, `#[windows::core::implement]` — which
# expands to bare `::windows_core::` paths — binds a different crate than the
# `_Impl` traits it must satisfy, and the build dies with a wall of E0277
# "the trait bound `IWbemObjectSink: windows_core::Interface` is not satisfied".
# Nothing about it is obvious from the diff: the version SET is unchanged, only
# an edge moved. It has already cost one debugging session (Dependabot #20,
# serde_with 3.20 -> 3.22, which touches none of this).
#
# These rules catch it in the ~40s Linux audit job instead of a ~3.5min Windows
# build. `wrappers` is the set of crates legitimately on the 0.61 line today, so
# cpal or wmi appearing there is what fails the gate.
#
# KNOWN AND ACCEPTED FALSE POSITIVE: this expresses "cpal and wmi must stay on
# the 0.62 line", not "their two edges must agree". A *matched* 0.61 pair also
# compiles and this would still reject it. If that ever happens, the fix is to
# widen these lists deliberately — which is the point, because the alternative
# is finding out on Windows.
#
# The real cure is upstream and already merged but unreleased: cpal master pins
# both to 0.62 (RustAudio/cpal#1244). `cpal = "0.18"` in
# apps/desktop/src-tauri/Cargo.toml already accepts it, so a lock update will
# pick it up with no manifest change, and these rules can then be deleted.
[[bans.deny]]
crate = "windows-core@0.61"
wrappers = [
  "tao",
  "webview2-com",
  "webview2-com-sys",
  "windows",
  "windows-collections",
  "windows-future",
  "windows-numerics",
  "wry",
]

[[bans.deny]]
crate = "windows@0.61"
wrappers = [
  "tao",
  "tauri",
  "tauri-plugin-opener",
  "tauri-runtime",
  "tauri-runtime-wry",
  "tauri-winrt-notification",
  "webview2-com",
  "webview2-com-sys",
  "wry",
]

[advisories]
# Vulnerabilities stay with cargo-audit (`.cargo/audit.toml`), which is already
# a blocking CI gate with written per-advisory justifications. Duplicating them
# here would mean two exemption lists drifting apart.
version = 2
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
