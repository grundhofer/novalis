# Weekly dependency PRs, grouped so a solo maintainer gets a few reviewable PRs
# a week instead of thirty single-crate ones.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]

  # ONE entry, pointing at the root. This is a pnpm workspace: the root holds
  # the single `pnpm-lock.yaml`, and Dependabot resolves the whole workspace
  # from there — a bump to a dependency declared in `packages/editor` arrives
  # as a root-scoped PR that edits that member's `package.json`.
  #
  # An earlier version of this file also listed `/apps/desktop`,
  # `/apps/desktop/frontend` and `/packages/*`, on the assumption that "/" alone
  # would leave member manifests unwatched. That assumption was wrong, and it
  # cost: every member dependency was seen twice, so a single TipTap 2 -> 3
  # upgrade opened eight PRs for four packages. The member-scoped job also emits
  # per-dependency PRs that edit a member `package.json` WITHOUT the root
  # lockfile (dependabot-core#11135), and those fail `pnpm install
  # --frozen-lockfile` in CI.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # TEMPORARY, remove once the TipTap 2 -> 3 migration has landed.
    #
    # v3 is a hand migration (see the `tiptap` group comment below), so every
    # major PR Dependabot opens for these is unmergeable by construction — and
    # it reopens them weekly, against a limit of 5 slots. Worse, some of them go
    # green: #41 was a lone `@tiptap/*` 2 -> 3 bump with 4/4 passing checks,
    # which is a merge waiting to happen.
    #
    # This suppresses only MAJORS. Patches and minors on the v2 line still
    # arrive, grouped. Delete this block the day the migration merges, or
    # Dependabot will silently sit out v4 as well.
    ignore:
      - dependency-name: "@tiptap/*"
        update-types: ["version-update:semver-major"]
      # `tiptap-markdown` 0.9.0 is the ONLY release that peers `@tiptap/core:
      # ^3.0.1`; 0.8.10 peers `^2.0.3`. It is therefore a hard prerequisite of
      # the v3 migration and must land in that branch, not before it — merging
      # it onto a v2 tree puts an unsatisfied peer on `main`, which (no
      # `.npmrc`, so non-strict peers) nobody would notice until much later.
      #
      # This entry exists because it already slipped through once. PR #39 had
      # it correctly in the `tiptap` group and was closed; Dependabot then
      # re-homed it into the `npm-minor-and-patch` group, where it rode along
      # in PR #51 next to a lucide-react and an eslint patch. A group boundary
      # is not a guarantee — an explicit version ignore is.
      #
      # Remove together with the block above when the migration lands.
      - dependency-name: "tiptap-markdown"
        versions: [">= 0.9"]
    groups:
      # MUST stay above npm-minor-and-patch: "if a dependency matches more than
      # one rule, it's included in the first group that it matches."
      #
      # TipTap is 15 `@tiptap/*` packages plus tiptap-markdown. Majors are
      # grouped here on purpose, which is the exception to the rule below: this
      # family only moves as a unit.
      #
      # The reason is API-level, NOT dependency-resolution-level. An earlier
      # version of this comment claimed a single-package bump "produces an
      # unsatisfiable graph" and "breaks the build in between". Both halves are
      # wrong and the evidence is in this repo's own PR history: v3's peer
      # ranges really are exact-pinned, but there is no `.npmrc`, so pnpm's
      # default `strict-peer-dependencies=false` applies and an unsatisfied peer
      # only warns at install. PR #41 bumped `@tiptap/extension-code-block-
      # lowlight` alone from 2.27.2 to 3.29.2 against a v2 tree and went 4/4
      # GREEN. (#42 and #43 did fail, which is the point: whether a lone bump
      # breaks is a coin flip, and a green one is worse than a red one.)
      #
      # What actually forces lockstep is the migration: StarterKit v3 newly
      # bundles Link and the list extensions and drops others, colliding with
      # this repo's own registrations in `NovalisEditor.tsx`, and `Placeholder`
      # moved packages. That is hand-work, not a version bump.
      tiptap:
        patterns: ["@tiptap/*", "tiptap-markdown"]
        update-types: ["major", "minor", "patch"]

      # Everything else: minor and patch only. Majors deliberately stay
      # ungrouped so a human reads the changelog before they land.
      #
      # katex is excluded because it ships 59 font files into the app bundle;
      # a rendering regression there is invisible to the test suite, so it gets
      # its own reviewable PR instead of riding in the "safe" bucket.
      npm-minor-and-patch:
        exclude-patterns: ["katex"]
        update-types: ["minor", "patch"]

  # Keeps the 40-char SHA pins in .github/workflows/*.yml current. It can only
  # do that for pins whose `# vX.Y.Z` comment names a real tag — the
  # dtolnay/rust-toolchain pin is a master-branch SHA and stays manual.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        update-types: ["minor", "patch"]
