name: E2E spike

# TEMPORARY. This workflow exists to answer one question — can an OS-level
# accessibility driver reach inside the real Novalis window and type into the
# TipTap editor — on all three platforms. It gates nothing, it is not called by
# `release.yml`, and it is expected to be deleted or rewritten once it has
# produced a verdict. See e2e/README.md.
#
# Deliberately NOT part of ci.yml: that file runs on every PR and every push to
# main, and its `cancel-in-progress` concurrency group would let this cancel
# real CI runs.

on:
  workflow_dispatch:
  push:
    branches: ["spike/e2e-**"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  spike:
    name: spike (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same set ci.yml installs for the Tauri Linux build.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libasound2-dev \
            patchelf \
            build-essential

      # Brings up Xvfb + D-Bus + the AT-SPI2 bus. There is no xvfb precedent in
      # this repo — bundle-smoke builds bundles but never launches one — so this
      # is new ground, not a copied pattern.
      - name: Set up the accessibility stack (Linux)
        if: matrix.platform == 'ubuntu-latest'
        uses: xa11y/setup-a11y@673fe58384fe2345d243a46d6d66b8094719e884 # v1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Keep in sync with rust-toolchain.toml, as ci.yml and release.yml do.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.93.0"

      # `shared-key` + `save-if: false` on purpose. The repo's Actions cache is
      # already ~12 GB against a 10 GiB limit and evicting, so this job READS
      # ci.yml's warm debug caches and writes none of its own — otherwise it
      # would both miss every restore and push out the caches CI depends on.
      # The `env:` block above must stay free of CARGO*/CC*/RUST* additions:
      # rust-cache hashes those into the key, and one stray var makes this a
      # permanent cache miss.
      - name: Cargo cache (read-only)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          shared-key: build
          save-if: false

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # --debug matches the profile ci.yml's warm caches were built with;
      # --no-bundle because the spike drives the raw binary, not an installer.
      - name: Build the app (debug, unbundled)
        run: pnpm --filter @novalis/desktop tauri build --debug --no-bundle

      - name: Install the spike harness
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Seed vault and settings
        run: node e2e/seed.mjs

      - name: Locate the binary
        id: bin
        shell: bash
        run: |
          set -euo pipefail
          # Cargo names it after the package (`novalis-desktop`); productName is
          # only used for bundles. Glob rather than hardcode so a rename or an
          # added [[bin]] does not silently break this.
          BIN=$(find target/debug -maxdepth 1 -type f \
                  \( -name 'novalis-desktop' -o -name 'novalis-desktop.exe' \) | head -1)
          if [ -z "$BIN" ]; then
            echo "no binary found; target/debug contains:" && ls -la target/debug | head -40
            exit 1
          fi
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "found: $BIN"

      - name: Run the spike (Linux, under Xvfb)
        if: matrix.platform == 'ubuntu-latest'
        run: xvfb-run -a node e2e/spike.mjs "${{ steps.bin.outputs.path }}"

      - name: Run the spike (macOS / Windows)
        if: matrix.platform != 'ubuntu-latest'
        run: node e2e/spike.mjs "${{ steps.bin.outputs.path }}"
