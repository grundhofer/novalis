name: Release

# Cut a release by pushing an annotated tag, e.g.:
#   git tag -a v0.1.0 -m "v0.1.0"
#   git push origin v0.1.0
#
# This workflow builds installers on Linux, macOS (Apple Silicon) and Windows,
# and attaches them to a *draft* GitHub release. Review and publish manually.
#
# Builds are currently unsigned — see RELEASING.md for the Phase B signing TODO.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Nothing by default; `contents: write` is granted to the `release` job alone,
# so the gate job below (which compiles third-party build scripts) never sees a
# token that could push to the repo or edit a release.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag push does not trigger ci.yml (`push: branches: [main]` only), so
  # without this a release would ship with zero fmt/clippy/test/lint/bindings
  # checks. Calling ci.yml rather than copying its steps means the release gate
  # cannot drift away from the PR gate. See RELEASING.md.
  gate:
    name: CI gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The real-app UI suite, in PARALLEL with the CI gate rather than after it:
  # both must pass before anything is built, and running them together costs the
  # release the difference between them (~4 min) instead of their sum. It is the
  # only gate that launches the app at all — everything else here is compilation
  # and unit tests.
  #
  # If it ever blocks a release wrongly, re-run the job first: a dropped input
  # event is the known failure mode and the suite retries activation three times
  # before giving up. Do not reach for `continue-on-error` — a gate that cannot
  # fail is not a gate. See e2e/README.md for what it does and does not cover.
  ui-gate:
    name: UI gate
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  release:
    name: build (${{ matrix.platform }})
    needs: [gate, ui-gate]
    runs-on: ${{ matrix.platform }}
    # tauri-action creates the draft release and uploads the installers.
    # `id-token: write` + `attestations: write` are the minimum pair
    # actions/attest-build-provenance needs: it signs with the job's short-lived
    # OIDC identity and writes the result to the repo's attestation store.
    #
    # This is the one job that both compiles third-party build scripts and holds
    # write scopes, which the file otherwise avoids. Accepted deliberately: the
    # attestation has to be minted where the artifact is produced or it attests
    # nothing, and this job already carries `contents: write`, so a hostile
    # build script could replace the installers regardless — the added scope
    # lets it sign what it replaced, not reach anything it could not already.
    # Moving the build off a write-scoped job (upload from a separate job via
    # actions/upload-artifact) is the real fix, and is not this change.
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # Apple Silicon ONLY, not a universal binary. `universal-apple-darwin`
            # cannot be built at all: it compiles an x86_64-apple-darwin slice,
            # and `ort-sys` (ONNX Runtime, via fastembed's `download-binaries`)
            # publishes no prebuilt for that target —
            #   error: ort-sys@2.0.0-rc.13: no prebuilt binaries available for
            #          target x86_64-apple-darwin
            # Its `build/download/dist.tsv` lists nine targets and Intel macOS is
            # not one of them (aarch64-apple-darwin is, with CoreML). 2.0.0-rc.13
            # is the latest release, so there is nothing to bump to.
            #
            # Restoring Intel macOS needs one of: upstream publishing the binary,
            # `ort`'s load-dynamic with a shipped ORT dylib, or feature-gating
            # embeddings off for that target — none of them a matrix tweak.
            #
            # Everything after `--` is forwarded to cargo by the tauri CLI;
            # `--locked` makes the shipped binary use the same Cargo.lock the
            # `audit` job cleared, instead of a fresh re-resolve at build time.
            args: --target aarch64-apple-darwin -- --locked
            rust-targets: aarch64-apple-darwin
          - platform: ubuntu-latest
            args: -- --locked
            rust-targets: ""
          - platform: windows-latest
            args: -- --locked
            rust-targets: ""

    steps:
      # `persist-credentials: false` matters most here: this job's token is
      # write-scoped, and without it the token sits in .git/config while
      # `pnpm install` runs esbuild's postinstall and ~925 crates' build.rs.
      # tauri-action takes GITHUB_TOKEN from `env` below, not from .git/config,
      # so removing it changes no behaviour.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WebKitGTK stack required for Tauri's Linux build (matches ci.yml);
      # libasound2-dev provides the ALSA headers cpal (native voice capture) links against.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libasound2-dev \
            patchelf \
            build-essential

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # dtolnay/rust-toolchain can't read rust-toolchain.toml (its `toolchain`
      # input is required), so the pin is duplicated here — keep it in sync
      # with rust-toolchain.toml when bumping. SHA is master's head, not a tag;
      # see the longer note in ci.yml for why, and how to re-resolve it.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.rust-targets }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & publish (tauri-action)
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Phase B: add APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
          # APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # here for macOS signing+notarization, and
          # WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD for Windows.
          # tauri-action reads them automatically when present.
        with:
          projectPath: apps/desktop
          # Build with the CLI this repo locks, not whatever `@tauri-apps/cli@v2`
          # resolves to today. `@tauri-apps/cli` is a devDependency of the ROOT
          # package.json only — `apps/desktop/package.json` declares no
          # dependencies at all — so tauri-action's `hasDependency` check misses
          # it and both v0.6.2 and v1.0.0 fall back to `npm install -g
          # @tauri-apps/cli@v2`. Releases were therefore built against an
          # unpinned CLI, and `-- --locked` in `args` constrains only cargo.
          #
          # That matters more under v1.0.0 than it did: v0.6.2 also looked for
          # lowercased Linux bundle names as a fallback, v1.0.0 looks only for
          # `productName`. So a CLI-side naming change now means the ubuntu job
          # finds zero artifacts instead of finding them under the other spelling.
          #
          # Setting tauriScript also makes v1.0.0 log "`tauriScript` set.
          # Skipping cli verification." and skip runner detection entirely, which
          # sidesteps its reworked find-up/`which pnpm` logic.
          tauriScript: pnpm --filter @novalis/desktop tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Novalis ${{ github.ref_name }}"
          releaseBody: |
            Novalis ${{ github.ref_name }}.

            Builds attached below are **unsigned**. See
            [RELEASING.md](https://github.com/grundhofer/novalis/blob/main/RELEASING.md#unsigned-build-warnings-what-users-see)
            for the warnings you'll see on first launch and how to bypass them.

            - **macOS:** `.dmg` — **Apple Silicon only.** Intel Macs are not
              supported: `ort-sys` (ONNX Runtime, pulled in for on-device
              embeddings) publishes no `x86_64-apple-darwin` prebuilt, so a
              universal binary cannot be compiled at all. See RELEASING.md.
            - **Linux:** `.AppImage`, `.deb` and `.rpm` (x86_64)
            - **Windows:** `.msi` and `.exe` (x86_64)
            - **Source:** `novalis-${{ github.ref_name }}-source.tar.gz` — the repository
              tree plus every Rust dependency vendored, including the GPL-2.0 libgit2 and
              LGPL-2.1 LibXDiff statically linked into the installers above. Attached here
              rather than only linked upstream because GPL-2.0 §3 requires the source to
              come from the same place as the binary. See `THIRD-PARTY-NOTICES.md`.

            ## Verifying a download

            Every asset is built by this repository's `Release` workflow and carries a
            signed provenance attestation. Since the builds are unsigned, this is the
            only way to establish where a file came from:

            ```sh
            gh attestation verify Novalis_*.dmg --repo grundhofer/novalis
            ```

            `SHA256SUMS` covers every asset on this release. To check whichever ones
            you downloaded, from the directory you downloaded them into:

            ```sh
            sha256sum --ignore-missing -c SHA256SUMS
            ```

            You should get one `OK` line per file you have. No output at all means
            you are not in the right directory — not that the check passed.
          releaseDraft: true
          # Derived, not hardcoded: a hardcoded `false` meant publishing a
          # `v0.2.1-rc1` draft would move the "Latest" badge off the stable
          # release and — via SECURITY.md's "Latest release | Yes" table —
          # silently designate a release candidate as the supported version.
          # `v*.*.*` tags carry a hyphen only when they are pre-releases
          # (`-rc1`, `-beta.1`), so the presence of one is the signal.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      # `artifactPaths` is a JSON array; attest-build-provenance wants one path
      # per line. Node rather than jq because setup-node above guarantees node
      # on all three runners, while jq's presence is a runner-image detail.
      # Reading the JSON from env, not interpolating it into the script, keeps
      # a path containing shell metacharacters from being executed.
      #
      # The `.app` -> `.app.tar.gz` rewrite is not cosmetic. tauri-action calls
      # `core.setOutput('artifactPaths', …)` BEFORE its macOS block tars
      # `Novalis.app` into `Novalis.app.tar.gz` and mutates `artifact.path`, so
      # the snapshot we read names the .app *directory* — which is not what gets
      # uploaded. Attesting it unrewritten would be wrong twice over: the
      # `.app.tar.gz` that actually ships would carry no attestation, and
      # @actions/glob (implicitDescendants defaults to true) would expand the
      # directory and attest every file inside the bundle instead. By the time
      # this step runs the .tar.gz exists on disk, so pointing at it is safe.
      # The uploaded asset is renamed to Novalis_<ver>_aarch64.app.tar.gz, which
      # does not matter: attestations are looked up by digest, not by filename.
      - name: Collect installer paths
        id: subjects
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          {
            echo 'paths<<SUBJECTS_EOF'
            node -e 'process.stdout.write([...new Set(JSON.parse(process.env.ARTIFACT_PATHS).map(p => p.endsWith(".app") ? p + ".tar.gz" : p))].join("\n") + "\n")'
            echo 'SUBJECTS_EOF'
          } >> "$GITHUB_OUTPUT"

      # Roadmap Phase 8.2. Binds each installer's digest to this workflow, this
      # commit and this runner identity, so `gh attestation verify` can prove a
      # download came from this repo's release build rather than from someone
      # who merely reached the releases page. Attestations are minted from the
      # job's OIDC token at build time, so they cannot be added to an already
      # built release afterwards.
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

  # GPL-2.0 §3 wants source offered "from the same place" as the binary. That is
  # stricter than it sounds: AGPL-3.0 §6(d) explicitly allows a *different*
  # server, GPL-2.0 has no such clause, so pointing at github.com/libgit2 is not
  # enough. Every installer above statically links libgit2 (GPL-2.0 with a
  # linking exception) and LibXDiff (LGPL-2.1-or-later, and NOT covered by that
  # exception — see THIRD-PARTY-NOTICES.md), so the corresponding source has to
  # be an asset on this same release.
  #
  # `cargo vendor` is the whole obligation in one command: it is target-agnostic
  # (run on Linux it still vendors the Windows- and macOS-only crates, verified),
  # so this single job covers all three platforms' binaries, and the result
  # resolves `Cargo.lock` fully offline. ~166 MB gzipped, far under GitHub's 2 GB
  # per-asset limit.
  source:
    name: source archive
    needs: release
    runs-on: ubuntu-latest
    # Same reasoning as the release job: write access only where an asset is
    # uploaded, and never in a job that compiles third-party build scripts.
    # The attestation pair is granted here too — attesting only the installers
    # would leave the one asset carrying an actual license obligation, the
    # vendored source tarball, without provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep in sync with rust-toolchain.toml, as in the release job above.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.93.0"

      # `--locked` so the vendored set is exactly what the installers were built
      # from; a re-resolve here would ship source for different code.
      - name: Vendor Rust dependencies
        run: cargo vendor --locked --versioned-dirs vendor > vendor-config.toml

      - name: Assemble source archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREFIX="novalis-${TAG}"
          mkdir -p "${RUNNER_TEMP}/stage/${PREFIX}"
          # git archive, not `cp -r`, so the tree is exactly the tagged commit
          # with no build output, no node_modules and no stray local files.
          git archive --format=tar HEAD | tar -x -C "${RUNNER_TEMP}/stage/${PREFIX}"
          mv vendor "${RUNNER_TEMP}/stage/${PREFIX}/vendor"
          # Append: .cargo/config.toml already exists in the repo (it pins
          # MACOSX_DEPLOYMENT_TARGET). Overwriting it would break the macOS build
          # for anyone rebuilding from this archive.
          printf '\n' >> "${RUNNER_TEMP}/stage/${PREFIX}/.cargo/config.toml"
          cat vendor-config.toml >> "${RUNNER_TEMP}/stage/${PREFIX}/.cargo/config.toml"
          cat > "${RUNNER_TEMP}/stage/${PREFIX}/SOURCE-ARCHIVE.md" <<EOF
          # Corresponding source for Novalis ${TAG}

          This is the tree the installers on the same GitHub release were built
          from, plus \`vendor/\` — every Rust dependency in \`Cargo.lock\`, at the
          exact versions used, fetched with \`cargo vendor --locked\`.

          It exists to satisfy two obligations at once. Novalis' own code is
          AGPL-3.0-only, so §6 requires the Corresponding Source for the binaries
          conveyed on this release; and GPL-2.0 §3 plus LGPL-2.1 §6 require the
          same for the copyleft C statically linked into them:

          - \`vendor/libgit2-sys-*/libgit2/\` — libgit2, GPL-2.0 with a linking exception
          - \`vendor/libgit2-sys-*/libgit2/deps/xdiff/\` — LibXDiff, LGPL-2.1-or-later,
            **not** covered by that exception
          - \`vendor/libgit2-sys-*/libgit2/deps/xdiff/xhistogram.c\` — EDL-1.0
          - \`vendor/libgit2-sys-*/libgit2/deps/winhttp/\` — LGPL-2.1-or-later (Windows)
          - \`vendor/openssl-src-*/openssl/\` — OpenSSL, Apache-2.0

          See \`THIRD-PARTY-NOTICES.md\` for the full picture and \`licenses/\` for
          the license texts.

          ## Building from it

          \`.cargo/config.toml\` already redirects crates.io to \`vendor/\`, so the
          Rust side builds with no network:

          \`\`\`sh
          pnpm install --frozen-lockfile   # JavaScript deps are NOT vendored; this needs network
          pnpm tauri build
          \`\`\`

          npm packages are not vendored, and that is a known gap rather than a
          settled question. No JavaScript dependency imposes a source-delivery
          obligation *of its own* — they are all permissive — but Novalis is
          AGPL-3.0-only, and §1 defines Corresponding Source as everything needed
          to generate and run the object code, which the third-party JavaScript
          compiled into \`dist/assets/*.js\` is. What the archive gives you instead
          is \`pnpm-lock.yaml\`, which pins every package to an exact version and
          integrity hash, so one \`pnpm install\` reproduces the same tree — from
          the network, not from this file. If that is not good enough for you,
          say so: <sebastiangrundhoefer@gmail.com>. The Rust/C half has no such
          gap; \`vendor/\` holds every crate's source.
          EOF
          tar czf "${PREFIX}-source.tar.gz" -C "${RUNNER_TEMP}/stage" "${PREFIX}"
          ls -lh "${PREFIX}-source.tar.gz"

      # Same reasoning as the installers' attestation, for the asset GPL-2.0 §3
      # and AGPL-3.0 §6 actually point at. Attested before upload: the subject
      # is the local file, and its digest is what ends up on the release.
      - name: Attest source archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: novalis-${{ github.ref_name }}-source.tar.gz

      # Uploaded to the draft the matrix above created — `gh` resolves drafts by
      # tag. --clobber so re-running the workflow on the same tag replaces the
      # asset instead of failing.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "${TAG}" "novalis-${TAG}-source.tar.gz" --clobber

      # Roadmap Phase 8.3. This job is terminal (`needs: release`) and the
      # source tarball is attached by the step above, so by here every asset of
      # the release exists — this is the only point in the workflow where a
      # manifest can cover all of them.
      #
      # GitHub already exposes a per-asset SHA-256 through its API, so this is
      # not the only integrity check available; what it adds is an offline one
      # (`sha256sum --ignore-missing -c SHA256SUMS`) that verifies a download set
      # at once, including copies obtained from a mirror rather than from GitHub.
      # The manifest lists all assets while nobody downloads all of them, hence
      # `--ignore-missing` in the instructions: without it the check exits 1 for
      # every realistic user.
      - name: Build SHA256SUMS
        id: sums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ASSETS="${RUNNER_TEMP}/assets"
          rm -rf "$ASSETS" && mkdir -p "$ASSETS"
          gh release download "${TAG}" --dir "$ASSETS" --pattern '*' --clobber
          cd "$ASSETS"
          # A re-run downloads the previous manifest too; hashing it into its
          # own successor would be both wrong and unverifiable.
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          echo "path=${ASSETS}/SHA256SUMS" >> "$GITHUB_OUTPUT"

      # The manifest is an asset like any other, and the release notes promise
      # provenance for all of them. Without this the one file a user is told to
      # trust for verifying the others would be the only unattested asset.
      - name: Attest SHA256SUMS provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.sums.outputs.path }}

      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "${TAG}" "${{ steps.sums.outputs.path }}" --clobber

      # tauri-action applies `prerelease:` only when it CREATES a release. Re-run
      # it against a draft that already exists — the recovery path RELEASING.md
      # documents — and the flag keeps whatever the first run set, silently. That
      # is how an rc could still be sitting at `prerelease: false` after the
      # workflow was fixed to derive it. Re-asserting it here, in the terminal
      # job, makes the workflow the actual source of truth rather than only the
      # nominal one. Only `${{ }}`-expanded booleans reach the shell, and the tag
      # comes in through env.
      #
      # The release BODY cannot be repaired the same way without duplicating the
      # whole template here, so that half stays a documented manual step.
      - name: Re-assert the pre-release flag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "${TAG}" --prerelease=${{ contains(github.ref_name, '-') }}
