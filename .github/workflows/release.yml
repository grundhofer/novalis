name: Release

# Cut a release by pushing an annotated tag, e.g.:
#   git tag -a v0.1.0 -m "v0.1.0"
#   git push origin v0.1.0
#
# This workflow builds installers on Linux, macOS (universal), and Windows,
# and attaches them to a *draft* GitHub release. Review and publish manually.
#
# Builds are currently unsigned — see RELEASING.md for the Phase B signing TODO.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Nothing by default; `contents: write` is granted to the `release` job alone,
# so the gate job below (which compiles third-party build scripts) never sees a
# token that could push to the repo or edit a release.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag push does not trigger ci.yml (`push: branches: [main]` only), so
  # without this a release would ship with zero fmt/clippy/test/lint/bindings
  # checks. Calling ci.yml rather than copying its steps means the release gate
  # cannot drift away from the PR gate. See RELEASING.md.
  gate:
    name: CI gates
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: build (${{ matrix.platform }})
    needs: gate
    runs-on: ${{ matrix.platform }}
    # tauri-action creates the draft release and uploads the installers.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # Single universal .dmg covers Intel + Apple Silicon. Everything
            # after `--` is forwarded to cargo by the tauri CLI; `--locked`
            # makes the shipped binary use the same Cargo.lock the `audit` job
            # cleared, instead of whatever cargo would re-resolve at build time.
            args: --target universal-apple-darwin -- --locked
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-latest
            args: -- --locked
            rust-targets: ""
          - platform: windows-latest
            args: -- --locked
            rust-targets: ""

    steps:
      # `persist-credentials: false` matters most here: this job's token is
      # write-scoped, and without it the token sits in .git/config while
      # `pnpm install` runs esbuild's postinstall and ~925 crates' build.rs.
      # tauri-action takes GITHUB_TOKEN from `env` below, not from .git/config,
      # so removing it changes no behaviour.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WebKitGTK stack required for Tauri's Linux build (matches ci.yml);
      # libasound2-dev provides the ALSA headers cpal (native voice capture) links against.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libasound2-dev \
            patchelf \
            build-essential

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # dtolnay/rust-toolchain can't read rust-toolchain.toml (its `toolchain`
      # input is required), so the pin is duplicated here — keep it in sync
      # with rust-toolchain.toml when bumping. SHA is master's head, not a tag;
      # see the longer note in ci.yml for why, and how to re-resolve it.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.rust-targets }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & publish (tauri-action)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Phase B: add APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
          # APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # here for macOS signing+notarization, and
          # WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD for Windows.
          # tauri-action reads them automatically when present.
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Novalis ${{ github.ref_name }}"
          releaseBody: |
            Novalis ${{ github.ref_name }}.

            Builds attached below are **unsigned**. See [RELEASING.md](../blob/main/RELEASING.md)
            for the warnings you'll see on first launch and how to bypass them.

            - **macOS:** universal `.dmg` (Intel + Apple Silicon)
            - **Linux:** `.AppImage` and `.deb`
            - **Windows:** `.msi` and `.exe`
            - **Source:** `novalis-${{ github.ref_name }}-source.tar.gz` — the repository
              tree plus every Rust dependency vendored, including the GPL-2.0 libgit2 and
              LGPL-2.1 LibXDiff statically linked into the installers above. Attached here
              rather than only linked upstream because GPL-2.0 §3 requires the source to
              come from the same place as the binary. See `THIRD-PARTY-NOTICES.md`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # GPL-2.0 §3 wants source offered "from the same place" as the binary. That is
  # stricter than it sounds: AGPL-3.0 §6(d) explicitly allows a *different*
  # server, GPL-2.0 has no such clause, so pointing at github.com/libgit2 is not
  # enough. Every installer above statically links libgit2 (GPL-2.0 with a
  # linking exception) and LibXDiff (LGPL-2.1-or-later, and NOT covered by that
  # exception — see THIRD-PARTY-NOTICES.md), so the corresponding source has to
  # be an asset on this same release.
  #
  # `cargo vendor` is the whole obligation in one command: it is target-agnostic
  # (run on Linux it still vendors the Windows- and macOS-only crates, verified),
  # so this single job covers all three platforms' binaries, and the result
  # resolves `Cargo.lock` fully offline. ~166 MB gzipped, far under GitHub's 2 GB
  # per-asset limit.
  source:
    name: source archive
    needs: release
    runs-on: ubuntu-latest
    # Same reasoning as the release job: write access only where an asset is
    # uploaded, and never in a job that compiles third-party build scripts.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep in sync with rust-toolchain.toml, as in the release job above.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.93.0"

      # `--locked` so the vendored set is exactly what the installers were built
      # from; a re-resolve here would ship source for different code.
      - name: Vendor Rust dependencies
        run: cargo vendor --locked --versioned-dirs vendor > vendor-config.toml

      - name: Assemble source archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREFIX="novalis-${TAG}"
          mkdir -p "${RUNNER_TEMP}/stage/${PREFIX}"
          # git archive, not `cp -r`, so the tree is exactly the tagged commit
          # with no build output, no node_modules and no stray local files.
          git archive --format=tar HEAD | tar -x -C "${RUNNER_TEMP}/stage/${PREFIX}"
          mv vendor "${RUNNER_TEMP}/stage/${PREFIX}/vendor"
          # Append: .cargo/config.toml already exists in the repo (it pins
          # MACOSX_DEPLOYMENT_TARGET). Overwriting it would break the macOS build
          # for anyone rebuilding from this archive.
          printf '\n' >> "${RUNNER_TEMP}/stage/${PREFIX}/.cargo/config.toml"
          cat vendor-config.toml >> "${RUNNER_TEMP}/stage/${PREFIX}/.cargo/config.toml"
          cat > "${RUNNER_TEMP}/stage/${PREFIX}/SOURCE-ARCHIVE.md" <<EOF
          # Corresponding source for Novalis ${TAG}

          This is the tree the installers on the same GitHub release were built
          from, plus \`vendor/\` — every Rust dependency in \`Cargo.lock\`, at the
          exact versions used, fetched with \`cargo vendor --locked\`.

          It exists to satisfy two obligations at once. Novalis' own code is
          AGPL-3.0-only, so §6 requires the Corresponding Source for the binaries
          conveyed on this release; and GPL-2.0 §3 plus LGPL-2.1 §6 require the
          same for the copyleft C statically linked into them:

          - \`vendor/libgit2-sys-*/libgit2/\` — libgit2, GPL-2.0 with a linking exception
          - \`vendor/libgit2-sys-*/libgit2/deps/xdiff/\` — LibXDiff, LGPL-2.1-or-later,
            **not** covered by that exception
          - \`vendor/libgit2-sys-*/libgit2/deps/xdiff/xhistogram.c\` — EDL-1.0
          - \`vendor/libgit2-sys-*/libgit2/deps/winhttp/\` — LGPL-2.1-or-later (Windows)
          - \`vendor/openssl-src-*/openssl/\` — OpenSSL, Apache-2.0

          See \`THIRD-PARTY-NOTICES.md\` for the full picture and \`licenses/\` for
          the license texts.

          ## Building from it

          \`.cargo/config.toml\` already redirects crates.io to \`vendor/\`, so the
          Rust side builds with no network:

          \`\`\`sh
          pnpm install --frozen-lockfile   # JavaScript deps are NOT vendored; this needs network
          pnpm tauri build
          \`\`\`

          npm packages are not vendored, and that is a known gap rather than a
          settled question. No JavaScript dependency imposes a source-delivery
          obligation *of its own* — they are all permissive — but Novalis is
          AGPL-3.0-only, and §1 defines Corresponding Source as everything needed
          to generate and run the object code, which the third-party JavaScript
          compiled into \`dist/assets/*.js\` is. What the archive gives you instead
          is \`pnpm-lock.yaml\`, which pins every package to an exact version and
          integrity hash, so one \`pnpm install\` reproduces the same tree — from
          the network, not from this file. If that is not good enough for you,
          say so: <sebastiangrundhoefer@gmail.com>. The Rust/C half has no such
          gap; \`vendor/\` holds every crate's source.
          EOF
          tar czf "${PREFIX}-source.tar.gz" -C "${RUNNER_TEMP}/stage" "${PREFIX}"
          ls -lh "${PREFIX}-source.tar.gz"

      # Uploaded to the draft the matrix above created — `gh` resolves drafts by
      # tag. --clobber so re-running the workflow on the same tag replaces the
      # asset instead of failing.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "${TAG}" "novalis-${TAG}-source.tar.gz" --clobber
