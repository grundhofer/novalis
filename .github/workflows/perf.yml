name: Perf

# Performance budgets (PLAN.md §11.3) on `main` and release tags only — never
# on PRs, where runner noise would make the numbers meaningless as a gate.
#
# This job MEASURES and GATES the two budgets the core can honestly produce:
# the cold cache scan and time to first search result, both on a generated
# 10k-note vault. `scripts/perf-budget.mjs` compares them against
# `docs/BUDGET.json` at 2× thresholds and fails the job on a breach.
#
# It does NOT cover the app-side rows (first paint, keystroke latency, RSS,
# note-open times): those need the shell with instrumentation that does not
# exist yet (Spike C). The harness lists them under `unmeasured` and the gate
# prints them, so a green run can never be mistaken for full coverage.
#
# It previously ran `cargo bench` against a crate with no bench targets and
# reported success, which is why the gate now fails when nothing is measured.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  perf:
    name: perf (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep in sync with rust-toolchain.toml; see the note in ci.yml.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.96.0"

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."

      - name: Generate a 10k-note vault
        run: python3 fixtures/gen/gen_vault.py "$RUNNER_TEMP/perf-vault" --count 10000

      - name: Measure
        run: |
          mkdir -p "$RUNNER_TEMP/perf-cache"
          cargo run --release --locked -p novalis-core --example perf -- \
            "$RUNNER_TEMP/perf-vault" "$RUNNER_TEMP/perf-cache" | tee measured.json

      # Raw numbers wrapped with the commit they belong to, so a slow drift is
      # visible in the artifacts even while the gate still passes. Node rather
      # than jq because the runner image guarantees node.
      - name: Write perf.json
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          node -e '
            const fs = require("node:fs");
            const measured = JSON.parse(fs.readFileSync("measured.json", "utf8"));
            fs.writeFileSync("perf.json", JSON.stringify({
              ref: process.env.REF,
              sha: process.env.SHA,
              runner: "macos-latest",
              date: new Date().toISOString(),
              budgetCompared: true,
              ...measured,
            }, null, 2) + "\n");
          '

      - name: Hold to docs/BUDGET.json
        run: node scripts/perf-budget.mjs measured.json

      - name: Upload perf.json
        # `always()`: a breach is exactly when the numbers are worth keeping.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          # The commit only: an artifact name may not contain a slash, and
          # `ref_name` is `fix/perf-gate` on a branch. The ref is recorded
          # inside perf.json, which is the place that needs it.
          name: perf-${{ github.sha }}
          path: perf.json
          retention-days: 90
