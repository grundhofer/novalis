# cargo-audit configuration.
#
# Accepted advisories — each entry needs a reason and a revisit condition.
# Every justification here must be checkable by a stranger with the command
# quoted next to it. If a claim stops being true, the entry goes, not the check.
[advisories]
ignore = [
    # RUSTSEC-2026-0194 and RUSTSEC-2026-0195 (quick-xml) USED TO BE HERE.
    # They are gone because the vulnerable version is gone, not because the
    # justification improved: docx-rs 0.4.22 moved to quick-xml 0.41, which made
    # `novalis-core` the last holder of 0.36.2, and it now builds on 0.41 too.
    # `awk '/^name = "quick-xml"$/{f=1} f&&/^version/{print;f=0}' Cargo.lock`
    # prints one line, 0.41.0. Both entries' own "revisit when" said exactly
    # this, so this is the check firing as designed rather than an exception
    # being widened.
    #
    # `import::enex::attr_value` still passes `.with_checks(false)` and nothing
    # constructs an `NsReader`. Both remain true and both are still worth
    # keeping true — but neither is load-bearing for the audit gate any more.

    # RUSTSEC-2026-0235 — rkyv 0.7.46: out-of-bounds reads validating archives
    # containing Rc/Arc.
    #
    # Not compiled. rkyv is a lockfile-only entry: it is an OPTIONAL dependency
    # of rust_decimal whose feature is never activated, so the crate never
    # enters the build graph.
    # Verify: `cargo tree -i rkyv -e normal --target all`
    #         → "warning: nothing to print."
    # Lockfile path: tauri-plugin-log → byte-unit 5.2.5 → rust_decimal 1.42.1
    #                → rkyv (optional, feature off).
    # cargo-audit reads Cargo.lock without resolving features, so this is a
    # genuine false positive rather than an accepted risk.
    #
    # Not fixable by upgrade: rkyv 0.7 → 0.8 is a semver-major bump three levels
    # deep inside Tauri's own plugin, so `cargo update` cannot resolve it.
    #
    # Revisit when: tauri-plugin-log's byte-unit dependency moves to a
    # rust_decimal built on rkyv >= 0.8.17, or if `cargo tree -i rkyv` ever
    # prints a real path (meaning something turned the feature on).
    "RUSTSEC-2026-0235",
]
