# cargo-audit configuration.
#
# Without this section `cargo audit` exits 0 on a yanked crate — it treats
# anything that is not a `vulnerability` as a warning. That is how spin 0.9.8
# and 0.10.0 reached all eight assets of the v0.2.1-rc1 draft, including the
# vendored source tarball, with a green CI run behind them. cargo-deny does not
# cover the gap either: ci.yml runs `check licenses bans sources`, and yanked
# lives under `advisories`.
#
# `yanked` only. NOT `unsound`: glib 0.18.5 (RUSTSEC-2024-0429) is unsound and
# unreachable — it comes through tauri -> gtk 0.18 — so denying it would pin CI
# red with no fix available. `quiet` is a required field of this section; omit
# it and cargo-audit dies with "missing field `quiet`" on every run.
[output]
deny = ["yanked"]
quiet = false
#
# Accepted advisories — each entry needs a reason and a revisit condition.
# Every justification here must be checkable by a stranger with the command
# quoted next to it. If a claim stops being true, the entry goes, not the check.
[advisories]
ignore = [
    # RUSTSEC-2026-0194 and RUSTSEC-2026-0195 (quick-xml) USED TO BE HERE.
    # They are gone because the vulnerable version is gone, not because the
    # justification improved: docx-rs 0.4.22 moved to quick-xml 0.41, which made
    # `novalis-core` the last holder of 0.36.2, and it now builds on 0.41 too.
    # `awk '/^name = "quick-xml"$/{f=1} f&&/^version/{print;f=0}' Cargo.lock`
    # prints one line, 0.41.0. Both entries' own "revisit when" said exactly
    # this, so this is the check firing as designed rather than an exception
    # being widened.
    #
    # `import::enex::attr_value` still passes `.with_checks(false)` and nothing
    # constructs an `NsReader`. Both remain true and both are still worth
    # keeping true — but neither is load-bearing for the audit gate any more.

    # RUSTSEC-2026-0235 (rkyv 0.7.46) USED TO BE HERE, and is gone for the same
    # reason the quick-xml pair above is: the crate it covered has left
    # Cargo.lock entirely, so the exception has nothing left to except.
    # `rg '^name = "rkyv"' Cargo.lock` prints nothing.
    #
    # Its own "revisit when" asked for the weaker condition — byte-unit moving
    # to a rust_decimal on rkyv >= 0.8.17 — and reality overtook it. A dead
    # ignore is not inert: it would silently re-accept the advisory if some
    # future dependency pulled rkyv 0.7 back in.
]
