[workspace]
resolver = "2"
members = [
    "crates/novalis-core",
    "crates/novalis-cli",
    "apps/desktop/src-tauri",
]

# Shared by every member (`version.workspace = true` etc.). `version` is one of
# the four stamps `just bump` writes and `scripts/check-versions.mjs` guards;
# never edit it by hand.
[workspace.package]
version = "2.0.0-alpha.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Sebastian Grundhöfer"]
repository = "https://github.com/grundhofer/novalis"

# One version per shared crate, referenced as `serde.workspace = true`.
# Deliberately no `anyhow`: core and CLI expose typed errors (`thiserror`) so
# the CLI can map them to its exit codes and the UI to i18n keys. A new entry
# here is a new dependency and needs an ADR (PLAN.md §11.5, D26).
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

# In-workspace crates
novalis-core = { path = "crates/novalis-core" }

[profile.release]
# Smaller, faster binaries — the DMG budget is 12 MB (PLAN.md §11.3).
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
