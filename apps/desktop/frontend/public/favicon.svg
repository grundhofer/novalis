<!-- COPY of apps/desktop/src-tauri/app-icon.svg — edit that one, then copy it
     here. (Vite can only serve assets from under the frontend root, and the
     source belongs next to the platform icons it generates.)

     The mark is die blaue Blume, the blue flower of Heinrich von Ofterdingen —
     German Romanticism's symbol of longing and the thing the app is named
     after: Novalis, whose Allgemeines Brouillon was a cross-referenced network
     of ~1150 note fragments, i.e. this app, 200 years early.

     Drawn for the 16px case, not the 1024px one: five heavy petals, wide gaps,
     no stroke thinner than ~50px at this scale, and a punched-out centre big
     enough to still register at 32px. Palette is the app's own indigo accent
     ramp (styles.css) on the dark surface. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252150"/>
      <stop offset="100%" stop-color="#161235"/>
    </linearGradient>
    <linearGradient id="petal" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="55%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#plate)"/>

  <g transform="translate(512 512) scale(1.16) translate(-512 -512)">
    <!-- Five petals: fat ellipses rotated about the centre. Deliberately few
         and heavy so the silhouette survives a 16px downscale. -->
    <g fill="url(#petal)">
      <ellipse cx="512" cy="347" rx="118" ry="165"/>
      <ellipse cx="512" cy="347" rx="118" ry="165" transform="rotate(72 512 512)"/>
      <ellipse cx="512" cy="347" rx="118" ry="165" transform="rotate(144 512 512)"/>
      <ellipse cx="512" cy="347" rx="118" ry="165" transform="rotate(216 512 512)"/>
      <ellipse cx="512" cy="347" rx="118" ry="165" transform="rotate(288 512 512)"/>
    </g>
    <!-- Punched-out centre, sized to still be visible at 32px: it is what makes
         the mark read as a flower rather than a five-pointed blob. -->
    <circle cx="512" cy="512" r="104" fill="#1b1740"/>
    <circle cx="512" cy="512" r="54" fill="#e0e7ff"/>
  </g>
</svg>
