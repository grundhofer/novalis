[package]
name = "novalis-desktop"
description = "novalis desktop app: the thin Tauri 2 shell around novalis-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Tauri wants a lib (the app entry point, also used by examples/gen_bindings)
# plus a thin binary that calls into it.
[lib]
name = "novalis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# ADR-0015: `read_blob` hands a PDF or image to the viewer as base64; the
# crate is already in Cargo.lock through Tauri, so this adds no entry.
base64 = "0.22.1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
novalis-core.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
sys-locale = "0.3.2"
tauri = { version = "2.11.5", features = ["specta"] }
tauri-plugin-dialog = "2.7.3"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
