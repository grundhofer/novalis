<!-- Android adaptive-icon BACKGROUND layer: full-bleed, no rounding. The
     launcher supplies the shape, so any corner radius here would fight it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252150"/>
      <stop offset="100%" stop-color="#161235"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#plate)"/>
</svg>
